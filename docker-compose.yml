# Levantar API + Client + DynamoDB con: docker compose up
# Requiere: api/.env.local y client/.env configurados (ver README)

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: vocali-dynamodb-local
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"
    working_dir: /home/dynamodblocal

  api:
    image: node:18-slim
    working_dir: /app
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    ports:
      - "3001:3001"
    env_file:
      - api/.env.local
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      DYNAMODB_USERS_TABLE: vocali-users-dev
      DYNAMODB_TRANSCRIPTIONS_TABLE: vocali-transcriptions-dev
      DYNAMODB_JOB_MAPPING_TABLE: vocali-job-mapping-dev
      NUXT_SKIP_OXC: "true"
    depends_on:
      - dynamodb-local
    command: >
      sh -c "
        npm install -g pnpm@9 &&
        pnpm install --no-frozen-lockfile --ignore-scripts &&
        (sleep 5 && pnpm run setup:local-db) &&
        pnpm run dev:api
      "

  client:
    image: node:18-slim
    working_dir: /app
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - client/.env
    environment:
      NUXT_PUBLIC_API_URL: http://localhost:3001
      NUXT_HOST: "0.0.0.0"
      NUXT_SKIP_OXC: "true"
    depends_on:
      - api
    command: >
      sh -c "
        npm install -g pnpm@9 &&
        pnpm install --no-frozen-lockfile --ignore-scripts &&
        pnpm run dev:client
      "

volumes:
  app_node_modules:
