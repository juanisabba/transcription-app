service: vocali-api

frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs18.x
  region: ${env:AWS_REGION, 'eu-north-1'}
  stage: ${opt:stage, 'dev'}
  apiGateway:
    shouldStartNameWithService: true
    binaryMediaTypes:
      - "multipart/form-data"
  memorySize: 512
  timeout: 28

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:ConditionCheckItem
          Resource:
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/vocali-users-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/vocali-users-${self:provider.stage}/index/*"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/vocali-transcriptions-${self:provider.stage}"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/vocali-transcriptions-${self:provider.stage}/index/*"
            - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/vocali-job-mapping-${self:provider.stage}"
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource:
            - !Sub "arn:aws:s3:::vocali-transcriptions-${self:provider.stage}"
            - !Sub "arn:aws:s3:::vocali-transcriptions-${self:provider.stage}/*"
        - Effect: Allow
          Action:
            - cognito-idp:AdminInitiateAuth
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminConfirmSignUp
            - cognito-idp:ListUsers
          Resource: !GetAtt CognitoUserPool.Arn

  environment:
    STAGE: ${self:provider.stage}
    DYNAMODB_USERS_TABLE: vocali-users-${self:provider.stage}
    DYNAMODB_TRANSCRIPTIONS_TABLE: vocali-transcriptions-${self:provider.stage}
    DYNAMODB_JOB_MAPPING_TABLE: vocali-job-mapping-${self:provider.stage}
    S3_BUCKET_NAME: vocali-transcriptions-${self:provider.stage}
    SPEECHMATICS_API_KEY: ${env:SPEECHMATICS_API_KEY, ''}
    SPEECHMATICS_WEBHOOK_URL: ${env:SPEECHMATICS_WEBHOOK_URL, ''}
    SPEECHMATICS_WEBHOOK_SECRET: ${env:SPEECHMATICS_WEBHOOK_SECRET, ''}
    SPEECHMATICS_BASE_URL: ${env:SPEECHMATICS_BASE_URL, 'https://eu1.asr.api.speechmatics.com/v2'}
    SPEECHMATICS_MANAGEMENT_URL: ${env:SPEECHMATICS_MANAGEMENT_URL, 'https://mp.speechmatics.com/v1'}
    SPEECHMATICS_RT_WS_URL: ${env:SPEECHMATICS_RT_WS_URL, 'wss://eu2.rt.speechmatics.com/v2/'}
    COGNITO_USER_POOL_ID: !Ref CognitoUserPool
    COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient
    COGNITO_AUTO_CONFIRM: ${self:custom.cognitoAutoConfirmByStage.${self:provider.stage}, 'false'}

functions:
  # ===== HELLO (Test Endpoint) =====
  hello:
    handler: dist/presentation/http/transcription/HelloHandler.handler
    events:
      - http:
          path: hello
          method: get
          cors: true

  # ===== AUTH ENDPOINTS =====

  register:
    handler: dist/presentation/http/auth/RegisterHandler.handler
    events:
      - http:
          path: auth/register
          method: post
          cors: true

  login:
    handler: dist/presentation/http/auth/LoginHandler.handler
    events:
      - http:
          path: auth/login
          method: post
          cors: true

  logout:
    handler: dist/presentation/http/auth/LogoutHandler.handler
    events:
      - http:
          path: auth/logout
          method: post
          cors: true
          authorizer: ${self:custom.cognitoAuthorizer}

  # ===== TRANSCRIPTION ENDPOINTS =====

  uploadTranscription:
    handler: dist/presentation/http/transcription/UploadHandler.handler
    events:
      - http:
          path: transcriptions/upload
          method: post
          cors: true
          authorizer: ${self:custom.cognitoAuthorizer}

  realtimeSession:
    handler: dist/presentation/http/transcription/RealtimeSessionHandler.handler
    events:
      - http:
          path: transcriptions/realtime
          method: post
          cors: true
          authorizer: ${self:custom.cognitoAuthorizer}

  realtimeToken:
    handler: dist/presentation/http/transcription/RealtimeTokenHandler.handler
    events:
      - http:
          path: transcriptions/realtime/token
          method: post
          cors: true
          authorizer: ${self:custom.cognitoAuthorizer}

  saveRealtimeTranscription:
    handler: dist/presentation/http/transcription/SaveRealtimeTranscriptionHandler.handler
    events:
      - http:
          path: transcriptions/realtime/{id}/save
          method: post
          cors: true
          authorizer: ${self:custom.cognitoAuthorizer}

  listTranscriptions:
    handler: dist/presentation/http/transcription/ListTranscriptionsHandler.handler
    events:
      - http:
          path: transcriptions
          method: get
          cors: true
          authorizer: ${self:custom.cognitoAuthorizer}

  statsTranscriptions:
    handler: dist/presentation/http/transcription/StatsHandler.handler
    events:
      - http:
          path: transcriptions/stats
          method: get
          cors: true
          authorizer: ${self:custom.cognitoAuthorizer}

  downloadTranscription:
    handler: dist/presentation/http/transcription/DownloadTranscriptionHandler.handler
    events:
      - http:
          path: transcriptions/{id}/download
          method: get
          cors: true
          authorizer: ${self:custom.cognitoAuthorizer}

  deleteTranscription:
    handler: dist/presentation/http/transcription/DeleteHandler.handler
    events:
      - http:
          path: transcriptions/{id}
          method: delete
          cors: true
          authorizer: ${self:custom.cognitoAuthorizer}

  confirmUpload:
    handler: dist/presentation/http/transcription/ConfirmUploadHandler.handler
    events:
      - http:
          path: transcriptions/{id}/confirm
          method: post
          cors: true
          authorizer: ${self:custom.cognitoAuthorizer}

  # ===== S3 EVENT TRIGGERS =====

  processAudioUpload:
    handler: dist/presentation/events/S3UploadHandler.handler
    events:
      - s3:
          bucket: !Ref TranscriptionsBucket
          event: s3:ObjectCreated:*
          rules:
            - prefix: uploads/
          existing: true

  # ===== WEBHOOKS =====

  speechmaticsWebhook:
    handler: dist/presentation/events/WebhookHandler.handler
    events:
      - http:
          path: webhook/speechmatics
          method: post

package:
  individually: true
  patterns:
    - "dist/**"
    - "!src/**"
    - "!node_modules/**"

plugins:
  - serverless-offline
  - serverless-dynamodb-local
  - serverless-dotenv-plugin

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: vocali-users-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: email-index
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    TranscriptionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: vocali-transcriptions-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: id
            AttributeType: S
          - AttributeName: status
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: status-index
            KeySchema:
              - AttributeName: status
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: createdAt-index
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    JobMappingTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: vocali-job-mapping-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: jobId
            AttributeType: S
        KeySchema:
          - AttributeName: jobId
            KeyType: HASH

    TranscriptionsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: vocali-transcriptions-${self:provider.stage}
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders:
                - "*"
              AllowedMethods:
                - GET
                - PUT
                - POST
                - HEAD
              AllowedOrigins:
                - "http://localhost:3000"
                - "http://localhost:3001"
              ExposedHeaders:
                - ETag
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: vocali-users-${self:provider.stage}
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
        Schema:
          - Name: email
            AttributeDataType: String
            Required: true
            Mutable: true

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: vocali-app-client-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool
        AllowedOAuthFlowsUserPoolClient: true
        AllowedOAuthFlows:
          - code
          - implicit
        AllowedOAuthScopes:
          - email
          - openid
          - profile
        CallbackURLs:
          - http://localhost:3000/auth/callback
          - https://localhost:3000/auth/callback
        LogoutURLs:
          - http://localhost:3000
          - https://localhost:3000
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
        GenerateSecret: false
        TokenValidityUnits:
          AccessToken: hours
          RefreshToken: days
        AccessTokenValidity: 1
        RefreshTokenValidity: 30

    # CORS en respuestas 4XX del authorizer (401 sin esto puede fallar en cross-origin)
    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        ResponseType: DEFAULT_4XX
        RestApiId:
          Ref: ApiGatewayRestApi

    GatewayResponseExpiredToken:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        ResponseType: EXPIRED_TOKEN
        RestApiId:
          Ref: ApiGatewayRestApi

  Outputs:
    CognitoUserPoolId:
      Value: !Ref CognitoUserPool
    CognitoUserPoolClientId:
      Value: !Ref CognitoUserPoolClient

custom:
  cognitoUserPoolArn:
    prod: "arn:aws:cognito-idp:eu-north-1:273386478728:userpool/eu-north-1_5WlAlQQHu"
    dev: !GetAtt CognitoUserPool.Arn
    default: !GetAtt CognitoUserPool.Arn
  cognitoAuthorizer:
    name: MyCognitoAuth
    type: COGNITO_USER_POOLS
    arn: ${self:custom.cognitoUserPoolArn.${self:provider.stage}, self:custom.cognitoUserPoolArn.default}
    identitySource: method.request.header.Authorization
  # COGNITO_AUTO_CONFIRM por stage (prod: verificación email; dev: auto-confirm)
  cognitoAutoConfirmByStage:
    prod: "true"
    dev: "true"
    local: "true"
  dotenv:
    exclude:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION
      # Variables dependientes del stage - evitan sobrescribir provider.environment
      - STAGE
      - DYNAMODB_USERS_TABLE
      - DYNAMODB_TRANSCRIPTIONS_TABLE
      - DYNAMODB_JOB_MAPPING_TABLE
      - S3_BUCKET_NAME
      - COGNITO_AUTO_CONFIRM
  dynamodb:
    stages:
      - local
      - dev
    start:
      host: localhost
      port: 8000
      region: localhost
      accessKeyId: local
      secretAccessKey: local
      inMemory: true
      migrate: false
      noStart: true

  serverless-offline:
    httpPort: 3001
    host: "0.0.0.0"
    noPrependStageInUrl: true
