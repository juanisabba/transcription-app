name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploying to production...
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
        env:
          NUXT_SKIP_OXC: true

      - name: Run Tests (API)
        run: pnpm --filter api run test
        env:
          NUXT_SKIP_OXC: true

      - name: Prepare Nuxt types (client)
        run: pnpm --filter client nuxi prepare
        env:
          NUXT_SKIP_OXC: true

      - name: Lint (API)
        run: pnpm --filter api run lint
        env:
          NUXT_SKIP_OXC: true

      - name: Build (API)
        run: pnpm --filter api run build
        env:
          NUXT_SKIP_OXC: true

      - name: Deploy to production
        run: pnpm --filter api exec serverless deploy --stage prod
        env:
          STAGE: prod
          COGNITO_AUTO_CONFIRM: "false"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          AWS_REGION: eu-north-1
          NUXT_SKIP_OXC: true
